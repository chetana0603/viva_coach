{% extends "base.html" %}
{% block content %}
<h1>Change password</h1>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field">Current password</label>
  <input type="password" name="current_password" autocomplete="current-password" required>
  <label class="field">New password</label>
  <input type="password" name="new_password" autocomplete="new-password" required>
  <p class="caption">At least 10 characters, with a letter and a number.</p>
  <label class="field">Confirm new password</label>
  <input type="password" name="confirm_password" autocomplete="new-password" required>
  <p style="margin-top:1rem"><button class="btn btn-primary">Change password</button></p>
</form>
{% endblock %}
